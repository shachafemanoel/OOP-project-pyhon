{% extends 'layout.html' %}
{% block content %}
<h1>Products</h1>
<div class="products">
    {% for key, product in products %}
    <div class="product">
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p>Price: {{ product.price }} {{ product.currency }}</p>
        <a href="{{ url_for('add_to_cart', product_id=key) }}">Add to Cart</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
